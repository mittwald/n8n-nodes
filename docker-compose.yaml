services:
  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_OWNER_EMAIL=test@example.com
      - N8N_OWNER_PASSWORD=testpassword
      - N8N_OWNER_FIRST_NAME=Test
      - N8N_OWNER_LAST_NAME=User
      # Optional: point the node at a non-production mittwald environment.
      # Empty or unset keeps the production API.
      - MITTWALD_API_BASE_URL=${MITTWALD_API_BASE_URL:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./dist:/home/node/.n8n/custom
volumes:
  n8n_data:
